apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ecommerce

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:

      containers:

        - name: backend

          image: ecommerce-backend:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:

            - name: DB_HOST
              value: mysql-service

            - name: DB_USER
              value: root

            - name: DB_PASSWORD
              value: rootpassword

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ecommerce

spec:

  selector:
    app: backend

  ports:

    - port: 8080
      targetPort: 8080

  type: ClusterIP
