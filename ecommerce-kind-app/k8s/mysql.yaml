apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:

      containers:

        - name: mysql

          image: mysql:8.0

          ports:
            - containerPort: 3306

          env:

            - name: MYSQL_ROOT_PASSWORD
              value: rootpassword

            - name: MYSQL_DATABASE
              value: ecommerce

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"

            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: ecommerce

spec:

  selector:
    app: mysql

  ports:

    - port: 3306
      targetPort: 3306

  type: ClusterIP
